<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coquito Amarillo - Tienda Web</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Coquito Amarillo SAS</h1>
        <p>Tienda web - Prototipo POO</p>
    </header>

    <main>
        <!-- SECCIÓN 1: CLIENTE -->
        <section id="seccion-cliente">
            <h2>1. Datos del Cliente</h2>
            <form id="form-cliente">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" required>

                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" required>

                <label for="ciudad">Ciudad de entrega:</label>
                <select id="ciudad" required>
                    <option value="">Seleccione...</option>
                    <option value="Medellin">Medellín</option>
                    <option value="Bogota">Bogotá</option>
                    <option value="Cali">Cali</option>
                    <option value="Barranquilla">Barranquilla</option>
                </select>

                <button type="button" id="btn-ubicacion">Usar mi ubicación</button>
                <button type="submit">Guardar Cliente</button>
            </form>
            <p id="mensaje-cliente"></p>
        </section>

        <!-- SECCIÓN 2: CATÁLOGO -->
        <section id="seccion-catalogo">
            <h2>2. Catálogo</h2>
            <div id="contenedor-productos"></div>
        </section>

        <!-- SECCIÓN 3: RESUMEN Y ENVÍO -->
        <section id="seccion-resumen">
            <h2>3. Resumen y Envío</h2>
            <div id="resumen-carrito">
                <p>Subtotal: <span id="subtotal">$0</span></p>
                <p>Envío: <span id="costo-envio">$0</span></p>
                <p>Clima: <span id="info-clima">-</span></p>
                <p>Comisión: <span id="comision">$0</span></p>
                <p><strong>Total: <span id="total">$0</span></strong></p>
            </div>

            <label for="moneda">Moneda de visualización:</label>
            <select id="moneda">
                <option value="COP">COP</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
            <p id="total-convertido"></p>

            <button type="button" id="btn-cotizar">Cotizar Envío</button>
        </section>

        <!-- SECCIÓN 4: PAGO -->
        <section id="seccion-pago">
            <h2>4. Pago</h2>
            <label for="medio-pago">Medio de pago:</label>
            <select id="medio-pago">
                <option value="tarjeta">Tarjeta</option>
                <option value="pse">PSE</option>
                <option value="nequi">Nequi</option>
            </select>

            <div id="campos-pago"></div>

            <label>
                <input type="checkbox" id="autorizacion" required>
                Autorizo el tratamiento de mis datos personales (Ley 1581 de 2012).
            </label>

            <button type="button" id="btn-pagar">Pagar Pedido</button>
            <button type="button" id="btn-nuevo-pedido">Nuevo Pedido</button>
        </section>

        <!-- SECCIÓN 5: RECIBO -->
        <section id="seccion-recibo" style="display:none;">
            <h2>Recibo de Compra</h2>
            <div id="contenido-recibo"></div>
        </section>
    </main>

    <!-- Consola de eventos -->
    <aside id="consola">
        <h3>Consola de Eventos</h3>
        <div id="log-eventos"></div>
    </aside>

    <!-- IMPORTANTE: Este script conecta todo -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
